<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phi-2 NumPy Edition</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', system-ui; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: #0f0f0f; border: 1px solid #222; border-radius: 12px; display: flex; flex-direction: column; height: 80vh; }
        #header { padding: 20px; border-bottom: 1px solid #222; text-align: center; color: #888; letter-spacing: 2px; font-size: 12px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: #fff; color: #000; font-weight: 500; }
        .ai { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; color: #00ff9d; }
        .input-area { padding: 20px; background: #0a0a0a; display: flex; gap: 10px; border-radius: 0 0 12px 12px; }
        input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 6px; outline: none; }
        button { background: #fff; color: #000; border: none; padding: 0 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div id="header">PHI-2 ARCHITECTURE | NUMPY CORE</div>
        <div id="chat">
            <div class="msg ai">Sincronização completa. Aguardando prompt...</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite um comando ou frase..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">RUN</button>
        </div>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const msg = input.value.trim();
            if (!msg) return;

            chat.innerHTML += `<div class="msg user">${msg}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: msg })
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg ai">${data.answer}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="msg ai" style="color:red">ERRO DE CONEXÃO</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
